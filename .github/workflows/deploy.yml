name: Deploy Backend to RedServer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "AGX BACKEND DEPLOYMENT STARTED"
            echo "======================================"

            cd /home/agxservice/agx-Service-Backend

            echo "1. Fetching latest code..."
            git fetch origin main

            echo "2. Updating server to latest main..."
            git reset --hard origin/main

            echo "3. Activating cPanel Node.js environment..."
            source /home/agxservice/nodevenv/agx-Service-Backend/24/bin/activate

            echo "4. Checking Node.js and npm..."
            node -v
            npm -v

            echo "5. Installing production dependencies..."
            npm install --omit=dev

            echo "6. Restarting Node.js application..."
            mkdir -p tmp
            touch tmp/restart.txt

            echo "7. Waiting for application restart..."
            sleep 8

            echo "8. Checking live API..."
            curl -fsS https://api.agxservice.online/api/health

            echo ""
            echo "======================================"
            echo "AGX BACKEND DEPLOYMENT SUCCESS"
            echo "======================================"